name: iso

on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true
      - run: |
          echo "UG=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: bib
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./config.toml
          image: ghcr.io/xenxaarn/xen:latest
          chown: ${{ env.UG }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs xfs
      - uses: actions/upload-artifact@v4
        with:
          name: xen-iso
          path: ${{ steps.bib.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
